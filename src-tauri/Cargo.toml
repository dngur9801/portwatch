[package]
name = "portwatch"
version = "0.1.0"
description = "메뉴바에서 리스닝 포트를 확인하고 프로세스를 종료하는 유틸리티"
authors = ["woohyuk"]
edition = "2021"

[lib]
name = "portwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
